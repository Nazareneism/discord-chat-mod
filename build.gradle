plugins {
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.0.0-beta8'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    // Use the no-remap variant for neoforge (required for unobfuscated MC 26.1)
    if (project.name == 'neoforge') {
        apply plugin: 'dev.architectury.loom-no-remap'
    } else {
        apply plugin: 'dev.architectury.loom'
    }
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
    }

    // MC 26.1 is unobfuscated; use local repo with corrected intermediary POM (upstream has version 0.0.0)
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'LocalIntermediary'
                    url = rootProject.file('local-repo')
                }
            }
            filter {
                includeModule 'net.fabricmc', 'intermediary'
            }
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }

    // Only add mappings for obfuscated (non-neoforge) modules
    if (project.name != 'neoforge') {
        dependencies {
            mappings loom.layered() {}
        }
    }

    // MC 26.1 is unobfuscated — disable transform tasks that try to remap (identity remap not supported)
    tasks.configureEach { task ->
        if (task.name.startsWith('transformProduction')) {
            task.enabled = false
        }
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
        }
    }
}
